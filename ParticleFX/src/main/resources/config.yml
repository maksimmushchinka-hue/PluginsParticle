# ===== ParticleFX: конфигурация =====
# Изменения применяются командой /particlefx reload

defaults:
  mode: FRONT              # SELF — на месте игрока, FRONT — перед игроком
  front-distance: 8.0      # расстояние до точки запуска в режиме FRONT (блоков)
  long-distance-render: true  # показывать частицы на большом расстоянии (до 512 блоков)

limits:
  scale:
    min: 0.25
    max: 4.0
  duration:      # секунды
    min: 3.0
    max: 60.0
  speed:
    min: 0.25
    max: 3.0
  density:
    min: 0.25
    max: 3.0
  radius:        # блоки
    min: 1.0
    max: 30.0
  height:        # блоки
    min: 1.0
    max: 40.0
  max-particles-per-tick-per-effect: 600   # лимит частиц за тик на один эффект
  max-particles-per-tick-global: 2500      # лимит частиц за тик на весь сервер
  max-active-effects-server: 20            # одновременно работающих эффектов на сервере
  max-active-effects-per-player: 3         # одновременно работающих эффектов на игрока
  admin-bypass-limits: true                # права particlefx.admin обходят лимиты количества эффектов

preview:
  max-duration-seconds: 6.0   # максимальная длительность предпросмотра
  scale-multiplier: 0.5       # множитель масштаба
  density-multiplier: 0.6     # множитель плотности
  private: true               # частицы предпросмотра видит только игрок

gui:
  step:
    scale: 0.25
    duration: 1.0
    speed: 0.25
    density: 0.25
    radius: 1.0
    height: 1.0

